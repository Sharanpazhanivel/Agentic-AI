[project]
name = "ai-incident-copilot"
version = "0.1.0"
description = "MVP multi-agent incident triage and fix planning platform."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "langgraph",
  "pydantic",
  "sqlalchemy",
  "psycopg[binary]",
  "qdrant-client",
  "httpx",
  "pytest",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
